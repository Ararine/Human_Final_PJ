<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">GARIM System Architecture</title>
  <desc id="desc">Frontend, backend, database, Redis, storage, tunnel, and Colab worker architecture for the GARIM project.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .group-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .box { stroke-width: 2; rx: 10; }
      .box-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .label { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-muted { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 6; }
      .frontend { fill: #e0f2fe; stroke: #0284c7; }
      .backend { fill: #dcfce7; stroke: #16a34a; }
      .worker { fill: #fef3c7; stroke: #d97706; }
      .data { fill: #ede9fe; stroke: #7c3aed; }
      .external { fill: #fce7f3; stroke: #db2777; }
      .tunnel { fill: #f1f5f9; stroke: #475569; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>

  <text class="title" x="70" y="64">GARIM Project System Architecture</text>
  <text class="subtitle" x="70" y="94">업로드, 분석 job, 진행률, Colab worker 연동 기준 구성도</text>

  <rect class="group" x="50" y="130" width="300" height="250"/>
  <text class="group-title" x="78" y="166">Client</text>
  <rect class="box frontend" x="90" y="200" width="220" height="120"/>
  <text class="box-title" x="125" y="238">React Frontend</text>
  <text class="box-text" x="125" y="268">로그인</text>
  <text class="box-text" x="125" y="292">파일 업로드</text>
  <text class="box-text" x="125" y="316">진행률 화면 표시</text>

  <rect class="group" x="430" y="120" width="350" height="560"/>
  <text class="group-title" x="458" y="156">Backend</text>
  <rect class="box backend" x="480" y="190" width="250" height="125"/>
  <text class="box-title" x="520" y="228">FastAPI Backend</text>
  <text class="box-text" x="520" y="258">Auth / Upload API</text>
  <text class="box-text" x="520" y="282">Progress API</text>
  <text class="box-text" x="520" y="306">Worker API</text>

  <rect class="box tunnel" x="480" y="385" width="250" height="100"/>
  <text class="box-title" x="522" y="424">Tunnel</text>
  <text class="box-text" x="522" y="454">Cloudflare Tunnel</text>
  <text class="box-text" x="522" y="478">또는 ngrok</text>

  <rect class="box external" x="480" y="555" width="250" height="80"/>
  <text class="box-title" x="520" y="590">Kakao OAuth</text>
  <text class="box-text" x="520" y="616">소셜 로그인 인증</text>

  <rect class="group" x="860" y="120" width="450" height="315"/>
  <text class="group-title" x="888" y="156">Data Layer</text>
  <rect class="box data" x="900" y="195" width="180" height="105"/>
  <text class="box-title" x="940" y="232">PostgreSQL</text>
  <text class="box-text" x="940" y="262">uploads</text>
  <text class="box-text" x="940" y="286">analysis_jobs</text>

  <rect class="box data" x="1090" y="195" width="180" height="105"/>
  <text class="box-title" x="1140" y="232">Redis</text>
  <text class="box-text" x="1140" y="262">세션</text>
  <text class="box-text" x="1140" y="286">토큰/임시 상태</text>

  <rect class="box data" x="900" y="325" width="370" height="75"/>
  <text class="box-title" x="1032" y="356">Local Storage</text>
  <text class="box-text" x="990" y="382">원본 업로드 파일 / 분석 산출물</text>

  <rect class="group" x="860" y="500" width="450" height="300"/>
  <text class="group-title" x="888" y="536">Google Colab</text>
  <rect class="box worker" x="905" y="575" width="180" height="115"/>
  <text class="box-title" x="944" y="612">Colab Worker</text>
  <text class="box-text" x="944" y="642">job polling</text>
  <text class="box-text" x="944" y="666">heartbeat</text>

  <rect class="box worker" x="1110" y="575" width="160" height="115"/>
  <text class="box-title" x="1144" y="612">Pipeline</text>
  <text class="box-text" x="1144" y="642">STT</text>
  <text class="box-text" x="1144" y="666">PII / Beep</text>

  <rect class="box worker" x="1000" y="715" width="220" height="55"/>
  <text class="box-title" x="1044" y="750">garim_pipeline.py</text>

  <path class="arrow" d="M310 260 C365 260, 415 252, 480 252"/>
  <text class="label" x="348" y="238">API 요청</text>

  <path class="arrow" d="M480 292 C415 310, 365 315, 310 315"/>
  <text class="label" x="350" y="342">진행률 응답</text>

  <path class="arrow" d="M730 232 C795 225, 835 230, 900 240"/>
  <text class="label" x="790" y="212">메타데이터/job/progress</text>

  <path class="arrow" d="M730 270 C835 285, 970 286, 1090 260"/>
  <text class="label" x="800" y="305">세션/토큰</text>

  <path class="arrow" d="M730 305 C790 350, 830 360, 900 365"/>
  <text class="label" x="772" y="372">파일 저장</text>

  <path class="arrow-muted" d="M605 315 L605 385"/>
  <text class="label" x="620" y="354">외부 공개 URL</text>

  <path class="arrow" d="M730 595 C790 595, 835 595, 905 610"/>
  <text class="label" x="778" y="578">/worker/* polling</text>

  <path class="arrow" d="M905 650 C830 640, 785 615, 730 595"/>
  <text class="label" x="754" y="646">진행률/결과 보고</text>

  <path class="arrow" d="M1085 632 L1110 632"/>
  <text class="label" x="1088" y="610">실행</text>

  <path class="arrow" d="M1190 690 L1120 715"/>
  <path class="arrow" d="M1110 715 L995 690"/>

  <path class="arrow" d="M605 555 L605 485"/>
  <text class="label" x="622" y="526">OAuth callback</text>

  <rect x="70" y="735" width="700" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="group-title" x="95" y="770">Main Runtime Flow</text>
  <text class="small" x="95" y="800">1. 프론트 업로드 완료 → 백엔드가 uploads / analysis_jobs 생성</text>
  <text class="small" x="95" y="824">2. Colab worker가 tunnel URL로 job polling → 파일 다운로드 → pipeline 실행</text>
  <text class="small" x="95" y="848">3. worker가 stage/progress/heartbeat/result를 백엔드에 보고 → 프론트가 진행률 표시</text>
</svg>
