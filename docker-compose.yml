version: "3.8"

services:
  final_db:
    image: pgvector/pgvector:pg16
    container_name: final_db
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - "./database/postgre_data:/var/lib/postgresql/data"
      - "./database/init:/docker-entrypoint-initdb.d"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garim_network

  final_redis:
    image: redis:7
    container_name: final_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - garim_network

  final_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: final_backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=final_db
      - REDIS_URL=redis://final_redis:6379/0
    depends_on:
      final_db:
        condition: service_healthy
      final_redis:
        condition: service_healthy
    networks:
      - garim_network

  final_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: final_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - final_backend
    networks:
      - garim_network

networks:
  garim_network:
    driver: bridge
